[project]
name = "apitest"
version = "0.1.0"
description = "API proxy quality testing framework"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.40",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "pytest-html>=4.0",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
